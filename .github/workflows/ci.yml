# Verificare completă: date, lint, build, teste unitare, teste cap-la-cap pe Chromium și WebKit.
#
# Pornire MANUALĂ (Actions → CI → Run workflow) până când contul are din nou acces la runnerele GitHub Actions
# (blocate cât timp metoda de plată a contului e marcată invalidă). Când accesul revine, se reactivează
# declanșarea automată punând la loc:
#   push:
#     branches: [main]
#   pull_request:
# Până atunci, aceleași verificări se rulează local cu `npm run check` înainte de fiecare push.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - name: Instalează browserele Playwright (Chromium + WebKit)
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
