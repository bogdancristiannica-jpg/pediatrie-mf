# Publicare alternativă pe GitHub Pages. Publicarea principală este pe Cloudflare Pages (vezi README, „Publicare”),
# care construiește direct din depozit, fără GitHub Actions.
#
# Pornire MANUALĂ (Actions → Pages → Run workflow). Dacă vrei din nou publicare automată pe GitHub Pages,
# pune la loc declanșarea:
#   push:
#     branches: [main]
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - run: npm run test:unit
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
